<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitHealth39</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(45deg, #ff66b2, #ed0b74, #ff00cc);
            margin: 0;
            font-family: 'Poppins', sans-serif;
            flex-direction: column;
        }

        .glass-text { font-size: 36px; font-weight: bold; color: rgba(255, 255, 255, 0.5); text-align: center; margin-bottom: 30px; backdrop-filter: blur(10px); padding: 20px; border-radius: 10px; width: 100%; transition: all 1s ease-out;}

        .glass-text:hover {
            color: rgba(255, 255, 255, 1);
        }

        .search-container {
            display: flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            padding: 15px 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .search-input {
            border: none;
            outline: none;
            font-size: 16px;
            padding: 12px 20px;
            width: 350px;
            border-radius: 30px;
            background: #f8f8f8;
            color: #333;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease-out;
        }

        .search-input:hover {
            box-shadow: inset 0 14px 25px rgba(0, 0, 0, 0.1);
        }

        .search-input::placeholder {
            color: #999;   
        }

        .search-input:focus {
            background: #fff;
            outline: none;
            box-shadow: inset 0 0px 0px rgba(0, 0, 0, 0.0);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .search-button {
            background: linear-gradient(135deg, #ff66b2, #ff3399);
            color: white;
            font-size: 16px;
            padding: 12px 25px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
            margin-top: 10px;
            border-radius: 10px;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #ddd;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .active-link {
            color: #ff3399;
            cursor: pointer;
            text-decoration: underline;
        }



        .search-dropdown a {
            color: #333;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            border-radius: 10px;
        }

        .search-dropdown a:hover {
            background-color: rgba(255, 102, 178, 0.1);
        }

        .health-group-title {
            font-size: 28px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 0.8s ease-out;
        }
    </style>
</head>
<body>
    <div class="blur-overlay">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
        </div>
        <div id="auth-container">
            <div id="login-form" style="display: block;">
                <div class="form-header">
                    <h2 class="form-title">Добро пожаловать</h2>
                    <p class="form-subtitle">Войдите в свой аккаунт</p>
                </div>
                <div class="input-wrapper">
                    <input type="email" id="login-email" placeholder="Email">
                    <span class="input-icon">✉</span>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="login-password" placeholder="Пароль">
                    <span class="input-icon">🔒</span>
                </div>
                <button id="login-btn">
                    <span class="btn-text">Войти</span>
                    <span class="btn-shine"></span>
                </button>
                <div class="form-divider">
                    <span>или</span>
                </div>
                <button id="show-register" class="switch-button">Создать аккаунт</button>
            </div>
            <div id="register-form" style="display: none;">
                <div class="form-header">
                    <h2 class="form-title">Регистрация</h2>
                    <p class="form-subtitle">Создайте новый аккаунт</p>
                </div>
                <div class="input-wrapper">
                    <input type="email" id="register-email" placeholder="Email">
                    <span class="input-icon">✉</span>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="register-password" placeholder="Пароль">
                    <span class="input-icon">🔒</span>
                </div>
                <button id="register-btn">
                    <span class="btn-text">Зарегистрироваться</span>
                    <span class="btn-shine"></span>
                </button>
                <div class="form-divider">
                    <span>или</span>
                </div>
                <button id="show-login" class="switch-button">Уже есть аккаунт?</button>
            </div>
        </div>
    </div>

    <h2 class="health-group-title">Выбор группы здоровья</h2>
    <img src="1.png" width="300px">
    <h1 class="glass-text">FitHealth39</h1>

    <button id="logout-btn" style="display: none;">Выйти</button>

    <div class="search-wrapper">
        <div class="health-group-hint">
            <div class="hint-circle">
                <span class="hint-text">Выберите группу здоровья</span>
            </div>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Введите группу здоровья">
        </div>
    </div>

    <div id="complex-container"></div>

    <script>
      // Подавление ошибок runtime.lastError
      (function() {
        const originalError = console.error;
        console.error = function(...args) {
          const message = args.join(' ');
          if (message.includes('runtime.lastError') || 
              message.includes('message port closed') ||
              message.includes('Extension context invalidated')) {
            return; // Игнорируем эти ошибки
          }
          originalError.apply(console, args);
        };
      })();
    </script>
    <script type="module">
      // Import the functions you need from the SDKs you need
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
      import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
      import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

      // Your web app's Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyC_B3PV_kh09VxW9qjkaaN3rxYq2qZCI9Y",
        authDomain: "fithealth-f4285.firebaseapp.com",
        projectId: "fithealth-f4285",
        storageBucket: "fithealth-f4285.firebasestorage.app",
        messagingSenderId: "943397255581",
        appId: "1:943397255581:web:a325d1af4172ac0dd15774"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);

      // Initialize Firebase Authentication and get a reference to the service
      const auth = getAuth(app);

      // Initialize Firebase Firestore
      const db = getFirestore(app);

      // Export auth and db for use in other scripts
      window.firebaseAuth = auth;
      window.firebaseDb = db;
      window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
      window.signInWithEmailAndPassword = signInWithEmailAndPassword;
      window.signOut = signOut;
      window.onAuthStateChanged = onAuthStateChanged;
      
      // Export Firestore functions
      window.firestoreCollection = collection;
      window.firestoreDoc = doc;
      window.firestoreSetDoc = setDoc;
      window.firestoreGetDoc = getDoc;
      window.firestoreUpdateDoc = updateDoc;
      window.firestoreServerTimestamp = serverTimestamp;
    </script>
    <script src="script.js"></script>
</body>
</html>
